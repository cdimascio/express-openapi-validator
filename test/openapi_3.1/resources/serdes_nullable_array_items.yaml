openapi: 3.1.0
info:
  title: Serdes with OpenAPI 3.1 array type specifier
  version: 1.0.0
servers:
  - url: /v1
paths:
  /nullable_dates:
    get:
      responses:
        200:
          description: 'Get nullable array of nullable dates'
          content:
            application/json:
              schema:
                # 3.1 syntax nullable array
                type: [array, 'null']
                items:
                  type: object
                  properties:
                    createdAt:
                      # 3.1 syntax nullable item
                      type: [string, 'null']
                      format: date-time
